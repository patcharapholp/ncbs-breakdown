<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCBS Planning Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-sunk:#F4F5F7;
    --border:#DFE1E6;
    --border-soft:#EBECF0;
    --ink:#172B4D;
    --ink-soft:#5E6C84;
    --ink-faint:#8993A4;
    --primary:#0052CC;
    --primary-hover:#0747A6;
    --primary-bg:#E9F2FF;
    --green:#22874E; --green-bg:#E3FCEF;
    --amber:#A54800; --amber-bg:#FFF7D6;
    --red:#AE2E24; --red-bg:#FFECEB;
    --purple:#5243AA; --purple-bg:#EAE6FF;
    --radius:8px; --radius-sm:6px;
    --shadow-sm:0 1px 2px rgba(9,30,66,.08);
    --shadow-md:0 3px 5px rgba(9,30,66,.10), 0 0 1px rgba(9,30,66,.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Thai',sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--primary); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button, input{ font-family:inherit; }
  ::selection{ background:var(--primary-bg); }

  .app{ display:flex; min-height:100vh; }

  /* ================= SIDEBAR ================= */
  .sidebar{
    width:268px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  }
  .sidebar-brand{ padding:18px 18px 14px; border-bottom:1px solid var(--border-soft); }
  .sidebar-brand .mark{ display:flex; align-items:center; gap:9px; }
  .sidebar-brand .logo{
    width:28px; height:28px; border-radius:6px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'IBM Plex Mono';
  }
  .sidebar-brand h1{ font-size:15px; margin:0; font-weight:700; }
  .sidebar-brand .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .nav-section{ padding:12px 10px; }
  .nav-section-label{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:4px 10px 6px; font-weight:600; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
    font-size:13.3px; font-weight:500; color:var(--ink-soft); cursor:pointer; transition:.1s ease;
  }
  .nav-item:hover{ background:var(--surface-sunk); color:var(--ink); }
  .nav-item.current{ background:var(--primary-bg); color:var(--primary); font-weight:600; }
  .nav-item .icon{ width:16px; text-align:center; flex-shrink:0; font-size:14px; }

  .epic-nav{ flex:1; min-height:0; display:flex; flex-direction:column; padding:0 10px 10px; }
  .epic-search{ position:relative; margin:4px 0 8px; }
  .epic-search input{
    width:100%; padding:7px 10px 7px 28px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:12.8px; background:var(--surface-sunk); color:var(--ink);
  }
  .epic-search input:focus{ outline:none; border-color:var(--primary); background:var(--surface); }
  .epic-search::before{ content:"⌕"; position:absolute; left:8px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:13px; }
  .system-filters{ display:flex; gap:4px; margin-bottom:8px; }
  .sys-chip{
    font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; padding:3px 8px; border-radius:12px;
    border:1px solid var(--border); color:var(--ink-faint); cursor:pointer; background:var(--surface);
  }
  .sys-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .epic-list{ overflow-y:auto; flex:1; }
  .epic-list-item{
    display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:var(--radius-sm);
    cursor:pointer; font-size:12.6px; color:var(--ink-soft); margin-bottom:1px;
  }
  .epic-list-item:hover{ background:var(--surface-sunk); }
  .epic-list-item.current{ background:var(--primary-bg); color:var(--primary); font-weight:600; }
  .epic-list-item .sys-tag{
    font-family:'IBM Plex Mono'; font-size:8.5px; font-weight:700; padding:1px 5px; border-radius:3px;
    background:var(--surface-sunk); color:var(--ink-faint); flex-shrink:0;
  }
  .epic-list-item .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .epic-list-item .dots{ display:flex; gap:2px; flex-shrink:0; }
  .epic-list-item .dots i{ width:5px; height:5px; border-radius:50%; display:block; }
  .epic-list-empty{ padding:16px 10px; font-size:12px; color:var(--ink-faint); text-align:center; }

  .sidebar-footer{ padding:12px 18px; border-top:1px solid var(--border-soft); font-size:10.8px; color:var(--ink-faint); }

  /* ================= SHELL / TOPBAR ================= */
  .shell{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border); padding:16px 28px;
    position:sticky; top:0; z-index:20;
  }
  .topbar-title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .topbar h2{ font-size:19px; margin:0; font-weight:700; display:flex; align-items:center; gap:10px; }
  .topbar .sys-badge{ font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:4px; background:var(--surface-sunk); color:var(--ink-faint); }
  .topbar .desc{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .topbar .stats{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-faint); text-align:right; }
  .topbar .stats b{ color:var(--ink); }

  .toolbar{ display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1; min-width:200px; max-width:320px; }
  .search-wrap input{
    width:100%; padding:7px 11px 7px 30px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); font-size:13px; color:var(--ink);
  }
  .search-wrap input:focus{ outline:none; border-color:var(--primary); }
  .search-wrap::before{ content:"⌕"; position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px; }
  .chip{
    font-family:'IBM Plex Mono'; font-size:11px; font-weight:600; padding:6px 11px;
    border:1px solid var(--border); border-radius:20px; background:var(--surface); cursor:pointer;
    display:flex; align-items:center; gap:6px; color:var(--ink-soft); user-select:none; transition:.1s ease;
  }
  .chip:hover{ border-color:var(--ink-faint); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .chip[data-c="green"] .dot{ background:var(--green); }
  .chip[data-c="yellow"] .dot{ background:var(--amber); }
  .chip[data-c="red"] .dot{ background:var(--red); }
  .btn{
    font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:var(--radius-sm); cursor:pointer; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.primary:hover{ background:var(--primary-hover); border-color:var(--primary-hover); }
  .btn.ghost-dashed{ border-style:dashed; }

  /* ================= MAIN ================= */
  main{ flex:1; padding:24px 28px 70px; min-width:0; }
  .view{ max-width:1360px; margin:0 auto; }
  .view[hidden]{ display:none; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
  .card-pad{ padding:18px 20px; }

  /* --- Feature chip nav (horizontal, replaces old vertical rail) --- */
  .feature-chip-nav{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .feature-chip{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .feature-chip:hover{ border-color:var(--primary); color:var(--primary); }
  .feature-chip .fnum{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-faint); }
  .feature-chip .dots{ display:flex; gap:2px; }
  .feature-chip .dots i{ width:5px; height:5px; border-radius:50%; display:block; }

  details.epic-deps{ margin-bottom:18px; }
  details.epic-deps summary{ cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; align-items:center; gap:8px; padding:14px 18px; }
  details.epic-deps summary::-webkit-details-marker{ display:none; }
  details.epic-deps summary::before{ content:"▸"; color:var(--ink-faint); transition:.15s; font-size:11px; }
  details.epic-deps[open] summary::before{ transform:rotate(90deg); }
  .dep-grid{ padding:0 18px 16px; display:grid; gap:1px; background:var(--border-soft); border-top:1px solid var(--border-soft); }
  .dep-row{ display:grid; grid-template-columns:280px 1fr; background:var(--surface); font-size:12.5px; }
  .dep-row > div{ padding:8px 0; }
  .dep-row .name{ font-weight:600; padding-right:14px; }
  .dep-row.blocker .name{ color:var(--red); }

  section.feature{ margin-bottom:18px; overflow:hidden; }
  .feature-head{
    display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer; user-select:none; border-bottom:1px solid var(--border);
  }
  .feature-head .fnum{ font-family:'IBM Plex Mono'; font-weight:700; font-size:12.5px; color:var(--primary); flex-shrink:0; }
  .feature-head h3{ font-size:14.5px; margin:0; font-weight:700; flex:1; min-width:0; }
  .feature-head .caret{ color:var(--ink-faint); font-size:12px; transition:.15s ease; flex-shrink:0; }
  .feature-head.collapsed .caret{ transform:rotate(-90deg); }
  .feature-tally{ display:flex; gap:6px; flex-shrink:0; }
  .feature-tally span{ font-family:'IBM Plex Mono'; font-size:10.5px; padding:2px 7px; border-radius:10px; }
  .tally-green{ background:var(--green-bg); color:var(--green); }
  .tally-yellow{ background:var(--amber-bg); color:var(--amber); }
  .tally-red{ background:var(--red-bg); color:var(--red); }

  .feature-source{ padding:9px 18px; font-size:12px; color:var(--ink-soft); border-bottom:1px solid var(--border-soft); background:var(--surface-sunk); }
  .feature-note{ padding:10px 18px; font-size:12.3px; color:var(--amber); background:var(--amber-bg); border-bottom:1px solid var(--border-soft); }

  .feature-body{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  thead th{
    text-align:left; padding:9px 12px; font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid var(--border); white-space:nowrap;
    background:var(--surface-sunk);
  }
  tbody tr{ border-bottom:1px solid var(--border-soft); }
  tbody tr:hover{ background:rgba(9,30,66,.02); }
  tbody tr.dim{ display:none; }
  td{ padding:9px 12px; vertical-align:top; }
  td.id{ font-family:'IBM Plex Mono'; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
  tr.sub td.id{ padding-left:24px; font-weight:400; }
  tr.sub td.id::before{ content:"└ "; color:var(--border); }
  td.task{ font-weight:600; min-width:180px; }
  tr.sub td.task{ font-weight:500; font-size:12.3px; color:var(--ink-soft); }
  td.desc{ color:var(--ink-soft); font-size:12.3px; min-width:190px; }
  td.dep{ font-size:11.8px; color:var(--ink-soft); min-width:130px; }
  td.src{ font-size:11.5px; min-width:130px; }
  td.clarity{ min-width:190px; }

  .stamp{ display:inline-flex; align-items:center; gap:7px; font-size:11.8px; }
  .stamp .badge{ width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .stamp.green .badge{ background:var(--green); }
  .stamp.yellow .badge{ background:var(--amber); }
  .stamp.red .badge{ background:var(--red); }
  .stamp-text{ color:var(--ink-soft); }
  .stamp.red .stamp-text{ color:var(--red); font-weight:600; }
  .stamp.yellow .stamp-text{ color:var(--amber); }

  .panel{ margin-bottom:18px; }
  .panel h3{ font-size:14px; margin:0 0 4px; padding:16px 20px 0; display:flex; align-items:center; gap:9px; }
  .panel .hint{ font-size:11.8px; color:var(--ink-faint); padding:0 20px; margin-bottom:12px; }
  ol.priority{ margin:0; padding:0 20px 18px 40px; }
  ol.priority li{ margin-bottom:8px; font-size:12.8px; }
  ol.priority b{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--primary); }

  .flags-panel{ border-left:4px solid var(--red); }
  ol.flags{ margin:0; padding:0 20px 18px; list-style:none; counter-reset:flag; }
  ol.flags li{
    counter-increment:flag; margin-bottom:10px; padding:12px 14px 12px 42px; position:relative;
    background:var(--red-bg); border-radius:var(--radius-sm); font-size:12.6px; line-height:1.6;
  }
  ol.flags li::before{
    content:counter(flag); position:absolute; left:12px; top:11px;
    font-family:'IBM Plex Mono'; font-weight:700; font-size:11.5px; color:#fff;
    background:var(--red); width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  ol.flags .epic-tags{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }
  ol.flags .epic-tags span{ font-family:'IBM Plex Mono'; font-size:9.5px; background:var(--surface); border:1px solid var(--border); padding:1px 6px; border-radius:8px; color:var(--ink-faint); }

  .empty-state{ padding:50px; text-align:center; color:var(--ink-faint); font-size:13px; display:none; }

  /* ================= OVERVIEW ================= */
  .stat-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:20px; }
  .stat-card{ padding:16px 18px; }
  .stat-card .num{ font-size:26px; font-weight:700; font-family:'IBM Plex Mono'; line-height:1; }
  .stat-card .label{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  .stat-card.green .num{ color:var(--green); } .stat-card.yellow .num{ color:var(--amber); } .stat-card.red .num{ color:var(--red); }

  .heatmap-row{ display:grid; grid-template-columns:220px 1fr 90px; align-items:center; gap:14px; padding:9px 20px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .heatmap-row:hover{ background:var(--surface-sunk); }
  .heatmap-row .ename{ font-size:12.8px; font-weight:600; display:flex; align-items:center; gap:7px; overflow:hidden; }
  .heatmap-row .ename .sys-tag{ font-family:'IBM Plex Mono'; font-size:8.5px; font-weight:700; padding:1px 5px; border-radius:3px; background:var(--surface-sunk); color:var(--ink-faint); flex-shrink:0; }
  .heatmap-bar{ height:10px; border-radius:5px; overflow:hidden; display:flex; background:var(--border-soft); }
  .heatmap-bar div{ height:100%; }
  .heatmap-row .counts{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); text-align:right; }

  /* ================= TIMELINE ================= */
  .project-config{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:18px 20px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .field input[type=date]{ padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:inherit; color:var(--ink); }
  .field-readout{ font-family:'IBM Plex Mono'; font-size:13px; padding:7px 0; }
  .field-readout b{ color:var(--primary); }
  .variance-ok{ color:var(--green); } .variance-bad{ color:var(--red); }

  .workload-strip{ display:flex; gap:2px; margin-top:14px; padding:0 20px 18px; }
  .workload-seg{ flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
  .workload-seg .role{ font-size:10px; color:var(--ink-faint); font-weight:600; }
  .workload-seg .val{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:700; margin-top:2px; }

  .gantt-wrap{ padding:16px 20px 20px; overflow-x:auto; }
  .gantt-row{ display:flex; align-items:center; gap:10px; height:26px; margin-bottom:3px; }
  .gantt-label{ width:230px; flex-shrink:0; font-size:11.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gantt-track{ position:relative; flex:1; height:16px; background:var(--surface-sunk); border-radius:4px; min-width:400px; }
  .gantt-bar{ position:absolute; top:0; height:100%; border-radius:4px; min-width:3px; }

  .timeline-toolbar{ display:flex; gap:8px; align-items:center; padding:14px 20px 0; flex-wrap:wrap; }
  .timeline-hint{ font-size:12px; color:var(--ink-faint); padding:0 20px 14px; }

  .plan-table th, .plan-table td{ text-align:center; }
  .plan-table td.task-cell, .plan-table th.task-cell{ text-align:left; }
  .plan-table input[type=number]{
    width:52px; padding:4px 5px; border:1px solid var(--border); border-radius:4px; text-align:center; font-size:12px; font-family:'IBM Plex Mono';
  }
  .plan-table input[type=number]:focus{ outline:none; border-color:var(--primary); }
  .plan-table .seq-input{ width:38px; }
  .plan-table td.total{ font-family:'IBM Plex Mono'; font-weight:700; }
  .plan-table td.dates{ font-family:'IBM Plex Mono'; font-size:11px; white-space:nowrap; }

  footer.app-footer{ text-align:center; padding:26px; color:var(--ink-faint); font-size:11px; font-family:'IBM Plex Mono'; }

  @media (max-width:1000px){
    .sidebar{ display:none; }
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark"><div class="logo">N</div><h1>NCBS Planning<br>Console</h1></div>
      <div class="sub">breakdown · timeline · gap analysis</div>
    </div>

    <div class="nav-section">
      <div class="nav-item" data-view="overview"><span class="icon">▤</span> Overview</div>
      <div class="nav-item" data-view="timeline"><span class="icon">▦</span> Timeline &amp; Planning</div>
    </div>

    <div class="epic-nav">
      <div class="nav-section-label">Epics</div>
      <div class="epic-search"><input id="epicSearch" type="text" placeholder="ค้นหา epic…"></div>
      <div class="system-filters" id="systemFilters"></div>
      <div class="epic-list" id="epicList"></div>
    </div>

    <div class="sidebar-footer">ncbs-breakdown · synthesize จาก ncbs-wiki · ไม่ผูกกับ commit ของ wiki</div>
  </aside>

  <div class="shell">
    <header class="topbar" id="topbar"></header>
    <main>
      <section class="view" id="viewOverview"></section>
      <section class="view" id="viewTimeline" hidden></section>
      <section class="view" id="viewEpic" hidden></section>
    </main>
    <footer class="app-footer">NCBS Planning Console · prototype · ข้อมูล timeline เก็บใน localStorage ของเบราว์เซอร์ (export/import เป็น JSON เพื่อแชร์ทีมได้)</footer>
  </div>
</div>

<!-- ไม่ต้องแก้ไฟล์นี้เพื่อเพิ่ม epic ใหม่อีกต่อไป — ระบบจะโหลดตาม data/manifest.json อัตโนมัติ (ดู README) -->

<script>
// ============================================================================
// Config
// ============================================================================
const clarityLabel = { green:"พร้อม dev", yellow:"ต้องเช็คก่อน confirm", red:"ยังเป็นแค่ proposed / block" };
const ROLES = [
  { key:'po_ba',    label:'PO/BA' },
  { key:'tech_lead',label:'Tech Lead' },
  { key:'dev',      label:'Dev' },
  { key:'qa_lead',  label:'QA Lead' },
  { key:'qa',       label:'QA' },
  { key:'pm',       label:'PM' },
  { key:'dm',       label:'DM' },
];
const ROLE_COLORS = ['#0052CC','#5243AA','#00875A','#FF8B00','#DE350B','#006644','#403294'];

let currentView = 'overview';
let currentEpicId = null;
let activeFilters = new Set(['green','yellow','red']);
let activeSystem = 'ALL';

// ============================================================================
// Data helpers
// ============================================================================
function allEpics(){ return window.NCBS_EPICS || {}; }
function epicIds(){ return Object.keys(allEpics()); }

function featureTally(f){
  const t = { green:0, yellow:0, red:0 };
  f.tasks.forEach(x=>{ t[x.c]++; if(x.subs) x.subs.forEach(s=>t[s.c]++); });
  return t;
}
function epicTally(epic){
  const t = { green:0, yellow:0, red:0 };
  epic.features.forEach(f=>{ const ft = featureTally(f); t.green+=ft.green; t.yellow+=ft.yellow; t.red+=ft.red; });
  return t;
}
function flattenAllTasks(){
  // returns [{key, epicId, epicName, featureId, featureName, task, isSub}]
  const out = [];
  epicIds().forEach(id=>{
    const epic = allEpics()[id];
    epic.features.forEach(f=>{
      f.tasks.forEach(t=>{
        out.push({ key:`${id}::${t.id}`, epicId:id, epicName:epic.name, featureId:f.id, featureName:f.name, task:t, isSub:false });
        if(t.subs) t.subs.forEach(s=> out.push({ key:`${id}::${s.id}`, epicId:id, epicName:epic.name, featureId:f.id, featureName:f.name, task:s, isSub:true }));
      });
    });
  });
  return out;
}

function applyEpicFilters(){

  });

    const visible = section.querySelectorAll('table tbody tr:not(.dim)').length;

  if(empty) empty.style.display = anyVisible ? 'none' : 'block';

function csvEscape(v){ const s=(v===undefined||v===null)?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportEpicCsv(){
  const epic = allEpics()[currentEpicId];
  const visibleIds = new Set();
  document.querySelectorAll('#viewEpic table tbody tr:not(.dim)').forEach(row=> visibleIds.add(row.querySelector('.id').textContent.trim()));
  const header = ["Epic","Feature ID","Feature","Task ID","Task","Description","Dependency","Source","Clarity","Clarity Note"];
  const rows = [header];
  epic.features.forEach(f=>{
    const push = t=> rows.push([epic.name,f.id,f.name,t.id,t.task,t.desc||'',t.dep||'',t.src||'',clarityLabel[t.c]||t.c,t.note||'']);
    f.tasks.forEach(t=>{ push(t); if(t.subs) t.subs.forEach(s=>push(s)); });
  });
  const finalRows = [rows[0], ...rows.slice(1).filter(r=>visibleIds.has(r[3]))];
  downloadCsv(finalRows, `ncbs-${currentEpicId}-breakdown-${new Date().toISOString().slice(0,10)}.csv`);
}
function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// Timeline & Planning
// ============================================================================
// ============================================================================
// Mock manday estimator — เดา effort คร่าวๆ จาก keyword + clarity ของแต่ละ task
// ไม่ใช่ estimate จริงจากทีม — เป็นแค่ตัวเลขตั้งต้นให้เริ่มคุยกันง่ายขึ้น
// ============================================================================
const EFFORT_TIERS = [
  { tier:5, kws:['engine','algorithm','matching','state machine','multi-level','approval chain','blockchain','anchor','workflow','orchestrat','สถาปัตยกรรม','เอนจิน'] },
  { tier:4, kws:['integration','sync','dashboard','queue','notification','schedul','gateway','ingestion','pipeline','etl','เชื่อมต่อ'] },
  { tier:3, kws:['model','schema','validation','api','page','form','config','migration','erd','ตรวจสอบ','แบบฟอร์ม'] },
  { tier:2, kws:['toggle','flag','field','button','display','label','rule','ui:','เพิ่ม','ปรับปรุง','ปุ่ม'] },
];
const TIER_BASE_DEV = { 1:0.5, 2:1, 3:2, 4:3.5, 5:6 };
const CLARITY_DEV_MULT = { green:1, yellow:1.25, red:1.5 };
const CLARITY_POBA_BONUS = { green:0, yellow:0.25, red:0.75 };
const CLARITY_PM = { green:0.1, yellow:0.25, red:0.5 };

function detectEffortTier(text){
  for(const g of EFFORT_TIERS){ if(g.kws.some(k=>text.includes(k))) return g.tier; }
  return 1;
}
function roundQuarter(n){ return Math.round(n*4)/4; }

function generateMockManday(task, isSub){
  const text = (task.task+' '+(task.desc||'')).toLowerCase();
  const tier = detectEffortTier(text);
  let dev = TIER_BASE_DEV[tier];
  if(isSub) dev *= 0.7; // sub-task มักแคบกว่า parent เสมอแม้ keyword จะจับ tier เดียวกัน
  dev *= (CLARITY_DEV_MULT[task.c] || 1);

  const poba    = roundQuarter(dev*0.15 + (CLARITY_POBA_BONUS[task.c]||0));
  const techLead= roundQuarter(Math.max(0.25, dev*0.15));
  const qaLead  = roundQuarter(Math.max(0.25, dev*0.10));
  const qa      = roundQuarter(dev*0.35);
  const pm      = roundQuarter(CLARITY_PM[task.c] ?? 0.1);
  const dm      = /sync|migrat|etl|batch|anchor|ซิงค์|ย้ายข้อมูล/.test(text) ? roundQuarter(dev*0.3) : 0;

  return { po_ba:poba, tech_lead:techLead, dev:roundQuarter(dev), qa_lead:qaLead, qa, pm, dm };
}

function applyMockEstimates(overwrite){
  const flat = flattenAllTasks();
  flat.forEach(x=>{
    const p = getTaskPlan(x.key);
    const mock = generateMockManday(x.task, x.isSub);
    ROLES.forEach(r=>{
      const current = Number(p.manday[r.key]||0);
      if(overwrite || !current) p.manday[r.key] = mock[r.key];
    });
  });
  savePlanState();
  renderTimelineBody();
}

function clearAllManday(){
  Object.values(planState.tasks).forEach(p=>{ ROLES.forEach(r=> p.manday[r.key]=0); });
  savePlanState();
  renderTimelineBody();
}


const PLAN_STORAGE_KEY = 'ncbs-planning-v1';
let planState = { projectStart:'', targetEnd:'', tasks:{} }; // tasks[key] = { seq, manday:{role:val}, }

function loadPlanState(){
  return fetch('data/planning-state.json').then(r=>{
    if(!r.ok) throw new Error('no file');
    return r.json();
  }).catch(()=>{
    try{ const raw = localStorage.getItem(PLAN_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }).then(data=>{
    if(data) planState = Object.assign({projectStart:'',targetEnd:'',tasks:{}}, data);
  });
}
function savePlanState(){
  try{ localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(planState)); }catch(e){}
}
function getTaskPlan(key){
  if(!planState.tasks[key]) planState.tasks[key] = { seq:0, manday:Object.fromEntries(ROLES.map(r=>[r.key,0])) };
  return planState.tasks[key];
}

function isWeekend(d){ const day=d.getDay(); return day===0||day===6; }
function nextBusinessDay(d){ const r=new Date(d); while(isWeekend(r)) r.setDate(r.getDate()+1); return r; }
function addBusinessDays(start, days){
  let d = new Date(start); let added=0;
  while(added<days){ d.setDate(d.getDate()+1); if(!isWeekend(d)) added++; }
  return d;
}
function fmtDate(d){ if(!d) return '–'; return d.toLocaleDateString('th-TH',{ year:'numeric', month:'short', day:'numeric' }); }

function computeSchedule(){
  const flat = flattenAllTasks().map(x=>{
    const p = getTaskPlan(x.key);
    return Object.assign({}, x, { plan:p });
  });
  flat.sort((a,b)=> (a.plan.seq||0) - (b.plan.seq||0));

  const start = planState.projectStart ? nextBusinessDay(new Date(planState.projectStart)) : null;
  let cursor = start;
  flat.forEach(x=>{
    const manday = Object.values(x.plan.manday||{});
    const duration = Math.ceil(Math.max(0, ...manday, 0));
    if(!cursor){ x.scheduledStart=null; x.scheduledEnd=null; x.duration=duration; return; }
    x.scheduledStart = new Date(cursor);
    x.scheduledEnd = duration>0 ? addBusinessDays(cursor, duration) : new Date(cursor);
    x.duration = duration;
    if(duration>0) cursor = x.scheduledEnd;
  });
  return { flat, projectEnd: cursor };
}

function renderTimeline(){
  const root = document.getElementById('viewTimeline');
  root.innerHTML = `

        <div class="field"><label>&nbsp;</label><div id="varianceReadout" class="field-readout"></div></div>
        <div style="flex:1"></div>
        <button class="btn" id="exportPlanJson">⇩ Export planning (JSON)</button>
        <button class="btn" id="importPlanJsonBtn">⇧ Import planning (JSON)</button>

        <button class="btn" id="exportTimelineCsv">⇩ Export timeline (CSV)</button>
      </div>
      <div class="timeline-toolbar" style="padding-top:0;">
        <button class="btn primary" id="applyMockFill">🪄 เติม mock estimate (เฉพาะช่องว่าง)</button>
        <button class="btn" id="applyMockOverwrite">🪄 เขียนทับทั้งหมดด้วย mock estimate</button>
        <button class="btn ghost-dashed" id="clearAllManday">↺ ล้าง manday ทั้งหมด</button>
      </div>
      <div class="timeline-hint" style="padding-top:6px;">Mock estimate เดาจาก keyword ใน task/description + clarity (🟢🟡🔴) ของแต่ละ task — เป็นแค่ตัวเลขตั้งต้นให้เริ่มคุยกับทีมง่ายขึ้น ไม่ใช่ estimate จริง ควรให้ Tech Lead/Dev ยืนยันก่อน commit sprint จริง</div>
      <div class="workload-strip" id="workloadStrip"></div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <h3 style="padding:16px 20px 0; margin:0; font-size:14px;">Gantt overview (ระดับ Feature)</h3>
      <div class="timeline-hint">Duration ต่อ task = manday สูงสุดในบรรดา 7 role (สมมติทำงานคู่ขนานภายใน task เดียว) เรียงตาม seq ต่อเนื่องกันแบบวันทำการ (เว้นเสาร์-อาทิตย์) — เป็น model แบบง่ายสำหรับวางแผนคร่าวๆ ไม่ใช่ critical-path engine เต็มรูปแบบ</div>
      <div class="gantt-wrap" id="ganttWrap"></div>
    </div>

    <div class="card">
      <div class="timeline-toolbar">
        <div class="search-wrap"><input id="planSearch" type="text" placeholder="ค้นหา task…"></div>
        <button class="btn ghost-dashed" id="collapseAllPlan">ยุบ/ขยายทั้งหมด</button>
      </div>
      <div class="timeline-hint">ใส่ manday เฉพาะ role ที่เกี่ยวข้อง (ที่เหลือปล่อย 0) · ลำดับ (Seq) แก้ได้เพื่อจัดคิวใหม่ · ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์นี้</div>
      <div class="feature-body" id="planTableWrap"></div>
    </div>
  `;

  document.getElementById('projectStart').value = planState.projectStart || '';
  document.getElementById('targetEnd').value = planState.targetEnd || '';

  document.getElementById('projectStart').addEventListener('change', e=>{ planState.projectStart=e.target.value; savePlanState(); renderTimelineBody(); });
  document.getElementById('targetEnd').addEventListener('change', e=>{ planState.targetEnd=e.target.value; savePlanState(); renderTimelineBody(); });
  document.getElementById('exportPlanJson').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(planState,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='planning-state.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);

  });

  });

  renderTimelineBody();
}

function renderTimelineBody(){
  const { flat, projectEnd } = computeSchedule();
  document.getElementById('computedEnd').innerHTML = projectEnd ? `<b>${fmtDate(projectEnd)}</b>` : 'กำหนด Start Date ก่อน';

  const varEl = document.getElementById('varianceReadout');
  if(planState.targetEnd && projectEnd){
    const target = new Date(planState.targetEnd);
    const diffDays = Math.round((target-projectEnd)/86400000);
    varEl.innerHTML = diffDays>=0
      ? `<span class="variance-ok">เหลือ buffer ~${diffDays} วัน</span>`
      : `<span class="variance-bad">เกินเป้า ~${Math.abs(diffDays)} วัน</span>`;
  } else varEl.textContent = '';

  // workload strip
  const totals = Object.fromEntries(ROLES.map(r=>[r.key,0]));
  flat.forEach(x=> ROLES.forEach(r=> totals[r.key] += Number(x.plan.manday[r.key]||0)));
  document.getElementById('workloadStrip').innerHTML = ROLES.map((r,i)=>`
    <div class="workload-seg"><div class="role">${r.label}</div><div class="val" style="color:${ROLE_COLORS[i]}">${totals[r.key]||0}</div></div>
  `).join('');

  // gantt (feature-level aggregation)
  const featureMap = {};
  flat.forEach(x=>{
    const fkey = `${x.epicId}::${x.featureId}`;
    if(!featureMap[fkey]) featureMap[fkey] = { epicName:x.epicName, featureName:x.featureName, start:null, end:null, clarity:{green:0,yellow:0,red:0} };
    const fm = featureMap[fkey];
    fm.clarity[x.task.c]++;
    if(x.scheduledStart && (!fm.start || x.scheduledStart < fm.start)) fm.start = x.scheduledStart;
    if(x.scheduledEnd && (!fm.end || x.scheduledEnd > fm.end)) fm.end = x.scheduledEnd;
  });
  const ganttEl = document.getElementById('ganttWrap');
  const allDates = Object.values(featureMap).filter(f=>f.start&&f.end);
  if(allDates.length===0 || !planState.projectStart){
    ganttEl.innerHTML = '<div class="timeline-hint">กำหนด Project Start Date และใส่ manday อย่างน้อย 1 task เพื่อดู Gantt chart</div>';
  } else {
    const minD = new Date(Math.min(...allDates.map(f=>f.start)));
    const maxD = new Date(Math.max(...allDates.map(f=>f.end)));
    const totalSpan = Math.max(1, (maxD-minD)/86400000);
    ganttEl.innerHTML = Object.values(featureMap).map(f=>{
      if(!f.start||!f.end) return '';
      const left = ((f.start-minD)/86400000)/totalSpan*100;
      const width = Math.max(0.6, ((f.end-f.start)/86400000)/totalSpan*100);
      const dominant = f.clarity.red ? 'var(--red)' : (f.clarity.yellow ? 'var(--amber)' : 'var(--green)');
      return `<div class="gantt-row">
        <div class="gantt-label" title="${f.epicName} — ${f.featureName}">${f.featureName}</div>
        <div class="gantt-track"><div class="gantt-bar" style="left:${left}%; width:${width}%; background:${dominant};" title="${fmtDate(f.start)} → ${fmtDate(f.end)}"></div></div>
      </div>`;
    }).join('');
  }

  // task table, grouped by epic (accordion, matches epic-view visual language)
  const wrap = document.getElementById('planTableWrap');
  wrap.innerHTML = '';
  const byEpic = {};
  flat.forEach(x=>{ (byEpic[x.epicId] = byEpic[x.epicId]||[]).push(x); });

  Object.keys(byEpic).forEach(epicId=>{
    const epic = allEpics()[epicId];
    const items = byEpic[epicId];
    const section = document.createElement('section');
    section.className = 'feature card'; section.style.marginBottom='10px';
    const rowsHtml = items.map(x=>{
      const roleInputs = ROLES.map(r=>`<td><input type="number" min="0" step="0.5" value="${x.plan.manday[r.key]||0}" data-key="${x.key}" data-role="${r.key}"></td>`).join('');
      const total = Object.values(x.plan.manday).reduce((a,b)=>a+Number(b||0),0);
      return `<tr data-searchtext="${(x.task.task+' '+x.featureName).toLowerCase()}">
        <td><input type="number" class="seq-input" value="${x.plan.seq||0}" data-key="${x.key}" data-field="seq"></td>
        <td class="task-cell mono" style="font-weight:600;">${x.task.id}</td>
        <td class="task-cell">${x.task.task}</td>
        ${roleInputs}
        <td class="total">${total}</td>
        <td class="dates">${x.scheduledStart?fmtDate(x.scheduledStart):'–'}<br>→ ${x.scheduledEnd?fmtDate(x.scheduledEnd):'–'}</td>
      </tr>`;
    }).join('');
    section.innerHTML = `
      <div class="feature-head" data-target="plan-${epicId}"><span class="fnum">${epic.system||''}</span><h3>${epic.name}</h3><span class="caret">▾</span></div>
      <div class="feature-body" id="plan-${epicId}-body">
        <table class="plan-table">
          <thead><tr><th>Seq</th><th class="task-cell">ID</th><th class="task-cell">Task</th>${ROLES.map(r=>`<th>${r.label}</th>`).join('')}<th>รวม</th><th>วันที่</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`;
    wrap.appendChild(section);
  });

  wrap.querySelectorAll('input[type=number]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const key = e.target.dataset.key;
      const p = getTaskPlan(key);
      if(e.target.dataset.field==='seq') p.seq = Number(e.target.value)||0;
      else p.manday[e.target.dataset.role] = Number(e.target.value)||0;
      savePlanState();
      renderTimelineBody();
    });
  });
  wrap.querySelectorAll('.feature-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      const body = document.getElementById(head.dataset.target+'-body') || head.parentElement.querySelector('.feature-body');
      const collapsed = head.classList.toggle('collapsed');
      body.style.display = collapsed ? 'none' : '';
    });
  });
}

function filterPlanTable(){
  const q = document.getElementById('planSearch').value.trim().toLowerCase();
  document.querySelectorAll('#planTableWrap tbody tr').forEach(row=>{
    row.style.display = (!q || row.dataset.searchtext.includes(q)) ? '' : 'none';
  });
}

function exportTimelineCsv(){
  const { flat } = computeSchedule();
  const header = ["Epic","Feature","Task ID","Task", ...ROLES.map(r=>r.label), "Total Manday","Start","End"];
  const rows = [header, ...flat.map(x=>[
    x.epicName, x.featureName, x.task.id, x.task.task,
    ...ROLES.map(r=>x.plan.manday[r.key]||0),
    Object.values(x.plan.manday).reduce((a,b)=>a+Number(b||0),0),
    x.scheduledStart?fmtDate(x.scheduledStart):'', x.scheduledEnd?fmtDate(x.scheduledEnd):''
  ])];
  downloadCsv(rows, `ncbs-timeline-${new Date().toISOString().slice(0,10)}.csv`);
}

// ============================================================================
// Boot — โหลด data file ทั้งหมดตาม data/manifest.json ก่อน แล้วค่อย build UI
// ============================================================================
function loadEpicScripts(){
  return fetch('data/manifest.json')
    .then(r=>{ if(!r.ok) throw new Error('manifest.json not found'); return r.json(); })
    .then(files=> Promise.all(files.map(f=> new Promise(resolve=>{
      const s = document.createElement('script');
      s.src = 'data/' + f;
      s.onload = resolve;
      s.onerror = ()=>{ console.warn('โหลดไม่สำเร็จ:', f); resolve(); };
      document.body.appendChild(s);
    }))))
    .catch(err=>{ console.warn('อ่าน data/manifest.json ไม่สำเร็จ — ตรวจว่ามีไฟล์นี้อยู่ใน data/ และรัน update-manifest.sh แล้วหรือยัง', err); });
}

loadEpicScripts().then(loadPlanState).then(()=>{
  buildSidebar();
  switchView('overview');
});
