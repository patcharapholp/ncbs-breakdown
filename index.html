<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCBS Planning Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-sunk:#F4F5F7;
    --border:#DFE1E6;
    --border-soft:#EBECF0;
    --ink:#172B4D;
    --ink-soft:#5E6C84;
    --ink-faint:#8993A4;
    --primary:#0052CC;
    --primary-hover:#0747A6;
    --primary-bg:#E9F2FF;
    --green:#22874E; --green-bg:#E3FCEF;
    --amber:#A54800; --amber-bg:#FFF7D6;
    --red:#AE2E24; --red-bg:#FFECEB;
    --purple:#5243AA; --purple-bg:#EAE6FF;
    --radius:8px; --radius-sm:6px;
    --shadow-sm:0 1px 2px rgba(9,30,66,.08);
    --shadow-md:0 3px 5px rgba(9,30,66,.10), 0 0 1px rgba(9,30,66,.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Thai',sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--primary); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button, input{ font-family:inherit; }
  ::selection{ background:var(--primary-bg); }

  .app{ display:flex; min-height:100vh; }

  /* ================= SIDEBAR ================= */
  .sidebar{
    width:268px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  }
  .sidebar-brand{ padding:18px 18px 14px; border-bottom:1px solid var(--border-soft); }
  .sidebar-brand .mark{ display:flex; align-items:center; gap:9px; }
  .sidebar-brand .logo{
    width:28px; height:28px; border-radius:6px; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'IBM Plex Mono';
  }
  .sidebar-brand h1{ font-size:15px; margin:0; font-weight:700; }
  .sidebar-brand .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  .nav-section{ padding:12px 10px; }
  .nav-section-label{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:4px 10px 6px; font-weight:600; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm);
    font-size:13.3px; font-weight:500; color:var(--ink-soft); cursor:pointer; transition:.1s ease;
  }
  .nav-item:hover{ background:var(--surface-sunk); color:var(--ink); }
  .nav-item.current{ background:var(--primary-bg); color:var(--primary); font-weight:600; }
  .nav-item .icon{ width:16px; text-align:center; flex-shrink:0; font-size:14px; }

  .epic-nav{ flex:1; min-height:0; display:flex; flex-direction:column; padding:0 10px 10px; }
  .epic-search{ position:relative; margin:4px 0 8px; }
  .epic-search input{
    width:100%; padding:7px 10px 7px 28px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:12.8px; background:var(--surface-sunk); color:var(--ink);
  }
  .epic-search input:focus{ outline:none; border-color:var(--primary); background:var(--surface); }
  .epic-search::before{ content:"⌕"; position:absolute; left:8px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:13px; }
  .system-filters{ display:flex; gap:4px; margin-bottom:8px; }
  .sys-chip{
    font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; padding:3px 8px; border-radius:12px;
    border:1px solid var(--border); color:var(--ink-faint); cursor:pointer; background:var(--surface);
  }
  .sys-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .epic-list{ overflow-y:auto; flex:1; }
  .epic-list-item{
    display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:var(--radius-sm);
    cursor:pointer; font-size:12.6px; color:var(--ink-soft); margin-bottom:1px;
  }
  .epic-list-item:hover{ background:var(--surface-sunk); }
  .epic-list-item.current{ background:var(--primary-bg); color:var(--primary); font-weight:600; }
  .epic-list-item .sys-tag{
    font-family:'IBM Plex Mono'; font-size:8.5px; font-weight:700; padding:1px 5px; border-radius:3px;
    background:var(--surface-sunk); color:var(--ink-faint); flex-shrink:0;
  }
  .epic-list-item .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .epic-list-item .dots{ display:flex; gap:2px; flex-shrink:0; }
  .epic-list-item .dots i{ width:5px; height:5px; border-radius:50%; display:block; }
  .epic-list-empty{ padding:16px 10px; font-size:12px; color:var(--ink-faint); text-align:center; }

  .sidebar-footer{ padding:12px 18px; border-top:1px solid var(--border-soft); font-size:10.8px; color:var(--ink-faint); }

  /* ================= SHELL / TOPBAR ================= */
  .shell{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border); padding:16px 28px;
    position:sticky; top:0; z-index:20;
  }
  .topbar-title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .topbar h2{ font-size:19px; margin:0; font-weight:700; display:flex; align-items:center; gap:10px; }
  .topbar .sys-badge{ font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:4px; background:var(--surface-sunk); color:var(--ink-faint); }
  .topbar .desc{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .topbar .stats{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-faint); text-align:right; }
  .topbar .stats b{ color:var(--ink); }

  .toolbar{ display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1; min-width:200px; max-width:320px; }
  .search-wrap input{
    width:100%; padding:7px 11px 7px 30px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); font-size:13px; color:var(--ink);
  }
  .search-wrap input:focus{ outline:none; border-color:var(--primary); }
  .search-wrap::before{ content:"⌕"; position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px; }
  .chip{
    font-family:'IBM Plex Mono'; font-size:11px; font-weight:600; padding:6px 11px;
    border:1px solid var(--border); border-radius:20px; background:var(--surface); cursor:pointer;
    display:flex; align-items:center; gap:6px; color:var(--ink-soft); user-select:none; transition:.1s ease;
  }
  .chip:hover{ border-color:var(--ink-faint); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .chip[data-c="green"] .dot{ background:var(--green); }
  .chip[data-c="yellow"] .dot{ background:var(--amber); }
  .chip[data-c="red"] .dot{ background:var(--red); }
  .btn{
    font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:var(--radius-sm); cursor:pointer; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .btn.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.primary:hover{ background:var(--primary-hover); border-color:var(--primary-hover); }
  .btn.ghost-dashed{ border-style:dashed; }

  /* ================= MAIN ================= */
  main{ flex:1; padding:24px 28px 70px; min-width:0; }
  .view{ max-width:1360px; margin:0 auto; }
  .view[hidden]{ display:none; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
  .card-pad{ padding:18px 20px; }

  /* --- Feature chip nav (horizontal, replaces old vertical rail) --- */
  .feature-chip-nav{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .feature-chip{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .feature-chip:hover{ border-color:var(--primary); color:var(--primary); }
  .feature-chip .fnum{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-faint); }
  .feature-chip .dots{ display:flex; gap:2px; }
  .feature-chip .dots i{ width:5px; height:5px; border-radius:50%; display:block; }

  details.epic-deps{ margin-bottom:18px; }
  details.epic-deps summary{ cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; align-items:center; gap:8px; padding:14px 18px; }
  details.epic-deps summary::-webkit-details-marker{ display:none; }
  details.epic-deps summary::before{ content:"▸"; color:var(--ink-faint); transition:.15s; font-size:11px; }
  details.epic-deps[open] summary::before{ transform:rotate(90deg); }
  .dep-grid{ padding:0 18px 16px; display:grid; gap:1px; background:var(--border-soft); border-top:1px solid var(--border-soft); }
  .dep-row{ display:grid; grid-template-columns:280px 1fr; background:var(--surface); font-size:12.5px; }
  .dep-row > div{ padding:8px 0; }
  .dep-row .name{ font-weight:600; padding-right:14px; }
  .dep-row.blocker .name{ color:var(--red); }

  section.feature{ margin-bottom:18px; overflow:hidden; }
  .feature-head{
    display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer; user-select:none; border-bottom:1px solid var(--border);
  }
  .feature-head .fnum{ font-family:'IBM Plex Mono'; font-weight:700; font-size:12.5px; color:var(--primary); flex-shrink:0; }
  .feature-head h3{ font-size:14.5px; margin:0; font-weight:700; flex:1; min-width:0; }
  .feature-head .caret{ color:var(--ink-faint); font-size:12px; transition:.15s ease; flex-shrink:0; }
  .feature-head.collapsed .caret{ transform:rotate(-90deg); }
  .feature-tally{ display:flex; gap:6px; flex-shrink:0; }
  .feature-tally span{ font-family:'IBM Plex Mono'; font-size:10.5px; padding:2px 7px; border-radius:10px; }
  .tally-green{ background:var(--green-bg); color:var(--green); }
  .tally-yellow{ background:var(--amber-bg); color:var(--amber); }
  .tally-red{ background:var(--red-bg); color:var(--red); }

  .feature-source{ padding:9px 18px; font-size:12px; color:var(--ink-soft); border-bottom:1px solid var(--border-soft); background:var(--surface-sunk); }
  .feature-note{ padding:10px 18px; font-size:12.3px; color:var(--amber); background:var(--amber-bg); border-bottom:1px solid var(--border-soft); }

  .feature-body{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  thead th{
    text-align:left; padding:9px 12px; font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid var(--border); white-space:nowrap;
    background:var(--surface-sunk);
  }
  tbody tr{ border-bottom:1px solid var(--border-soft); }
  tbody tr:hover{ background:rgba(9,30,66,.02); }
  tbody tr.dim{ display:none; }
  td{ padding:9px 12px; vertical-align:top; }
  td.id{ font-family:'IBM Plex Mono'; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
  tr.sub td.id{ padding-left:24px; font-weight:400; }
  tr.sub td.id::before{ content:"└ "; color:var(--border); }
  td.task{ font-weight:600; min-width:180px; }
  tr.sub td.task{ font-weight:500; font-size:12.3px; color:var(--ink-soft); }
  td.desc{ color:var(--ink-soft); font-size:12.3px; min-width:190px; }
  td.dep{ font-size:11.8px; color:var(--ink-soft); min-width:130px; }
  td.src{ font-size:11.5px; min-width:130px; }
  td.clarity{ min-width:190px; }

  .stamp{ display:inline-flex; align-items:center; gap:7px; font-size:11.8px; }
  .stamp .badge{ width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .stamp.green .badge{ background:var(--green); }
  .stamp.yellow .badge{ background:var(--amber); }
  .stamp.red .badge{ background:var(--red); }
  .stamp-text{ color:var(--ink-soft); }
  .stamp.red .stamp-text{ color:var(--red); font-weight:600; }
  .stamp.yellow .stamp-text{ color:var(--amber); }

  .panel{ margin-bottom:18px; }
  .panel h3{ font-size:14px; margin:0 0 4px; padding:16px 20px 0; display:flex; align-items:center; gap:9px; }
  .panel .hint{ font-size:11.8px; color:var(--ink-faint); padding:0 20px; margin-bottom:12px; }
  ol.priority{ margin:0; padding:0 20px 18px 40px; }
  ol.priority li{ margin-bottom:8px; font-size:12.8px; }
  ol.priority b{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--primary); }

  .flags-panel{ border-left:4px solid var(--red); }
  ol.flags{ margin:0; padding:0 20px 18px; list-style:none; counter-reset:flag; }
  ol.flags li{
    counter-increment:flag; margin-bottom:10px; padding:12px 14px 12px 42px; position:relative;
    background:var(--red-bg); border-radius:var(--radius-sm); font-size:12.6px; line-height:1.6;
  }
  ol.flags li::before{
    content:counter(flag); position:absolute; left:12px; top:11px;
    font-family:'IBM Plex Mono'; font-weight:700; font-size:11.5px; color:#fff;
    background:var(--red); width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  ol.flags .epic-tags{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }
  ol.flags .epic-tags span{ font-family:'IBM Plex Mono'; font-size:9.5px; background:var(--surface); border:1px solid var(--border); padding:1px 6px; border-radius:8px; color:var(--ink-faint); }

  .empty-state{ padding:50px; text-align:center; color:var(--ink-faint); font-size:13px; display:none; }

  /* ================= OVERVIEW ================= */
  .stat-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:20px; }
  .stat-card{ padding:16px 18px; }
  .stat-card .num{ font-size:26px; font-weight:700; font-family:'IBM Plex Mono'; line-height:1; }
  .stat-card .label{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  .stat-card.green .num{ color:var(--green); } .stat-card.yellow .num{ color:var(--amber); } .stat-card.red .num{ color:var(--red); }

  .heatmap-row{ display:grid; grid-template-columns:220px 1fr 90px; align-items:center; gap:14px; padding:9px 20px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .heatmap-row:hover{ background:var(--surface-sunk); }
  .heatmap-row .ename{ font-size:12.8px; font-weight:600; display:flex; align-items:center; gap:7px; overflow:hidden; }
  .heatmap-row .ename .sys-tag{ font-family:'IBM Plex Mono'; font-size:8.5px; font-weight:700; padding:1px 5px; border-radius:3px; background:var(--surface-sunk); color:var(--ink-faint); flex-shrink:0; }
  .heatmap-bar{ height:10px; border-radius:5px; overflow:hidden; display:flex; background:var(--border-soft); }
  .heatmap-bar div{ height:100%; }
  .heatmap-row .counts{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); text-align:right; }

  /* ================= TIMELINE ================= */
  .project-config{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:18px 20px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .field input[type=date]{ padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:inherit; color:var(--ink); }
  .field-readout{ font-family:'IBM Plex Mono'; font-size:13px; padding:7px 0; }
  .field-readout b{ color:var(--primary); }
  .variance-ok{ color:var(--green); } .variance-bad{ color:var(--red); }

  .workload-strip{ display:flex; gap:2px; margin-top:14px; padding:0 20px 18px; }
  .workload-seg{ flex:1; text-align:center; padding:10px 4px; border-radius:var(--radius-sm); background:var(--surface-sunk); }
  .workload-seg .role{ font-size:10px; color:var(--ink-faint); font-weight:600; }
  .workload-seg .val{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:700; margin-top:2px; }

  .og-scroll{ overflow-x:auto; overflow-y:visible; }
  .timeline-toolbar{ display:flex; gap:8px; align-items:center; padding:14px 20px 0; flex-wrap:wrap; }
  .timeline-hint{ font-size:12px; color:var(--ink-faint); padding:0 20px 14px; }
  .og-header-row{ display:flex; height:32px; border-bottom:1.5px solid var(--border); background:var(--surface-sunk); position:sticky; top:0; z-index:5; }
  .og-label-col-head{ width:340px; flex-shrink:0; position:sticky; left:0; z-index:6; background:var(--surface-sunk); border-right:1px solid var(--border); display:flex; align-items:center; padding:0 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); }
  .og-timeline-head{ position:relative; flex-shrink:0; }
  .og-date-tick{ position:absolute; top:0; height:100%; display:flex; align-items:center; font-family:'IBM Plex Mono'; font-size:10px; color:var(--ink-faint); padding-left:5px; border-left:1px solid var(--border); white-space:nowrap; }

  .og-row{ display:flex; align-items:stretch; border-bottom:1px solid var(--border-soft); min-height:32px; }
  .og-row:hover{ background:rgba(9,30,66,.025); }
  .og-row.hidden-item{ opacity:.4; }
  .og-row.level-epic{ background:var(--surface-sunk); }
  .og-row.dragging{ opacity:.35; }
  .og-row.drag-over-top{ box-shadow: inset 0 2px 0 var(--primary); }
  .og-row.drag-over-bottom{ box-shadow: inset 0 -2px 0 var(--primary); }

  .og-label-cell{
    width:340px; flex-shrink:0; position:sticky; left:0; z-index:3; background:var(--surface);
    display:flex; align-items:center; gap:6px; padding:0 10px; border-right:1px solid var(--border); overflow:hidden;
  }
  .og-row.level-epic .og-label-cell{ background:var(--surface-sunk); font-weight:700; }
  .og-row.level-feature .og-label-cell{ padding-left:28px; font-weight:600; }
  .og-row.level-task .og-label-cell{ padding-left:46px; cursor:pointer; }
  .og-row.level-task .og-label-cell:hover .og-name{ color:var(--primary); }

  .og-drag-handle{ cursor:grab; color:var(--ink-faint); font-size:12px; flex-shrink:0; }
  .og-drag-handle:active{ cursor:grabbing; }
  .og-eye{ cursor:pointer; font-size:12px; flex-shrink:0; color:var(--ink-faint); }
  .og-eye:hover{ color:var(--primary); }
  .og-caret{ font-size:9px; color:var(--ink-faint); flex-shrink:0; width:10px; cursor:pointer; transition:.15s; display:inline-block; }
  .og-caret.collapsed{ transform:rotate(-90deg); }
  .og-sys{ font-family:'IBM Plex Mono'; font-size:8.5px; font-weight:700; background:var(--surface); border:1px solid var(--border); padding:0 5px; border-radius:3px; color:var(--ink-faint); flex-shrink:0; }
  .og-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .og-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.4px; flex:1; min-width:0; }
  .og-badge{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--ink-faint); flex-shrink:0; }

  .og-timeline-cell{ position:relative; flex-shrink:0; }
  .og-bar{ position:absolute; top:8px; height:16px; border-radius:4px; min-width:4px; cursor:pointer; }
  .og-row.level-epic .og-bar{ top:11px; height:8px; opacity:.85; }
  .og-row.level-feature .og-bar{ top:9px; height:11px; opacity:.9; }

  .og-detail{ padding:14px 20px 16px 66px; background:var(--surface-sunk); border-bottom:1px solid var(--border); font-size:12.6px; }
  .og-detail-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px 24px; margin-bottom:12px; }
  .og-detail-grid div b{ display:block; font-size:10px; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-bottom:2px; letter-spacing:.03em; }
  .og-manday-inputs{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .og-manday-inputs .mini-field{ display:flex; flex-direction:column; gap:3px; }
  .og-manday-inputs label{ font-size:9.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; }
  .og-manday-inputs input, .og-sub-row input{ width:56px; padding:5px 6px; border:1px solid var(--border); border-radius:5px; text-align:center; font-family:'IBM Plex Mono'; font-size:12px; }
  .og-manday-inputs input:focus, .og-sub-row input:focus{ outline:none; border-color:var(--primary); }
  .og-sub-list{ margin-top:10px; border-top:1px dashed var(--border); padding-top:8px; }
  .og-sub-list-label{ font-size:9.5px; text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:6px; letter-spacing:.04em; }
  .og-sub-row{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:11.8px; flex-wrap:wrap; }
  .og-sub-row .og-name{ flex:1; min-width:160px; }

  footer.app-footer{ text-align:center; padding:26px; color:var(--ink-faint); font-size:11px; font-family:'IBM Plex Mono'; }

  @media (max-width:1000px){
    .sidebar{ display:none; }
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="mark"><div class="logo">N</div><h1>NCBS Planning<br>Console</h1></div>

<!-- ไม่ต้องแก้ไฟล์นี้เพื่อเพิ่ม epic ใหม่อีกต่อไป — ระบบจะโหลดตาม data/manifest.json อัตโนมัติ (ดู README) -->

<script>
// ============================================================================
// Config
// ============================================================================
const clarityLabel = { green:"พร้อม dev", yellow:"ต้องเช็คก่อน confirm", red:"ยังเป็นแค่ proposed / block" };
const ROLES = [
  { key:'po_ba',    label:'PO/BA' },
  { key:'tech_lead',label:'Tech Lead' },
  { key:'dev',      label:'Dev' },
  { key:'qa_lead',  label:'QA Lead' },
  { key:'qa',       label:'QA' },
  { key:'pm',       label:'PM' },
  { key:'dm',       label:'DM' },
];
const ROLE_COLORS = ['#0052CC','#5243AA','#00875A','#FF8B00','#DE350B','#006644','#403294'];

let currentView = 'overview';
let currentEpicId = null;
let activeFilters = new Set(['green','yellow','red']);
let activeSystem = 'ALL';

// ============================================================================
// Data helpers
// ============================================================================
function allEpics(){ return window.NCBS_EPICS || {}; }
function epicIds(){ return Object.keys(allEpics()); }

function featureTally(f){
  const t = { green:0, yellow:0, red:0 };
  f.tasks.forEach(x=>{ t[x.c]++; if(x.subs) x.subs.forEach(s=>t[s.c]++); });
  return t;
}
function epicTally(epic){
  const t = { green:0, yellow:0, red:0 };
  epic.features.forEach(f=>{ const ft = featureTally(f); t.green+=ft.green; t.yellow+=ft.yellow; t.red+=ft.red; });
  return t;
}
function flattenAllTasks(){
  // returns [{key, epicId, epicName, featureId, featureName, task, isSub}]
  const out = [];
  epicIds().forEach(id=>{
    const epic = allEpics()[id];
    epic.features.forEach(f=>{
      f.tasks.forEach(t=>{
        out.push({ key:`${id}::${t.id}`, epicId:id, epicName:epic.name, featureId:f.id, featureName:f.name, task:t, isSub:false });
        if(t.subs) t.subs.forEach(s=> out.push({ key:`${id}::${s.id}`, epicId:id, epicName:epic.name, featureId:f.id, featureName:f.name, task:s, isSub:true }));
      });
    });
  });
  return out;
}

// ============================================================================
// Sidebar: nav + epic list
// ============================================================================
function buildSidebar(){
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', ()=> switchView(item.dataset.view));
  });

  const systems = new Set(['ALL']);
  epicIds().forEach(id=> systems.add(allEpics()[id].system || 'NCBS'));
  const sysFilterEl = document.getElementById('systemFilters');
  sysFilterEl.innerHTML = '';
  [...systems].forEach(sys=>{
    const chip = document.createElement('div');
    chip.className = 'sys-chip' + (sys==='ALL' ? ' active':'');
    chip.textContent = sys;
    chip.dataset.sys = sys;
    chip.addEventListener('click', ()=>{
      activeSystem = sys;
      document.querySelectorAll('.sys-chip').forEach(c=>c.classList.toggle('active', c.dataset.sys===sys));
      renderEpicList();
    });
    sysFilterEl.appendChild(chip);
  });

  document.getElementById('epicSearch').addEventListener('input', renderEpicList);
  renderEpicList();
}

function renderEpicList(){
  const q = document.getElementById('epicSearch').value.trim().toLowerCase();
  const listEl = document.getElementById('epicList');
  listEl.innerHTML = '';
  const ids = epicIds().filter(id=>{
    const e = allEpics()[id];
    const matchesSys = activeSystem==='ALL' || (e.system||'NCBS')===activeSystem;
    const matchesQ = !q || e.name.toLowerCase().includes(q) || (e.thaiName||'').toLowerCase().includes(q);
    return matchesSys && matchesQ;
  });
  if(ids.length===0){ listEl.innerHTML = '<div class="epic-list-empty">ไม่พบ epic ที่ตรงกับตัวกรอง</div>'; return; }
  ids.forEach(id=>{
    const e = allEpics()[id];
    const t = epicTally(e);
    const item = document.createElement('div');
    item.className = 'epic-list-item' + (id===currentEpicId && currentView==='epic' ? ' current':'');
    item.innerHTML = `<span class="sys-tag">${e.system||''}</span><span class="name">${e.name}</span>
      <span class="dots">
        ${t.green?'<i style="background:var(--green)"></i>':''}
        ${t.yellow?'<i style="background:var(--amber)"></i>':''}
        ${t.red?'<i style="background:var(--red)"></i>':''}
      </span>`;
    item.addEventListener('click', ()=> openEpic(id));
    listEl.appendChild(item);
  });
}

function switchView(view){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(i=> i.classList.toggle('current', i.dataset.view===view));
  document.getElementById('viewOverview').hidden = view!=='overview';
  document.getElementById('viewTimeline').hidden = view!=='timeline';
  document.getElementById('viewEpic').hidden = view!=='epic';
  renderEpicList();
  if(view==='overview') renderOverview();
  if(view==='timeline') renderTimeline();
  renderTopbar();
}

function openEpic(id){
  currentEpicId = id;
  switchView('epic');
  renderEpicView(id);
}

// ============================================================================
// Topbar (contextual per view)
// ============================================================================
function renderTopbar(){
  const bar = document.getElementById('topbar');
  if(currentView==='overview'){
    bar.innerHTML = `<div class="topbar-title-row"><div><h2>ภาพรวมโครงการ</h2><div class="desc">สรุปสถานะ readiness ของทุก epic + ประเด็นที่กระทบข้าม epic</div></div></div>`;
  } else if(currentView==='timeline'){
    bar.innerHTML = `<div class="topbar-title-row"><div><h2>Timeline &amp; Planning</h2><div class="desc">กำหนด start date ของโครงการ ใส่ manday ต่อ role ต่อ task แล้วดูตารางเวลาที่คำนวณให้อัตโนมัติ</div></div></div>`;
  } else if(currentView==='epic'){
    const epic = allEpics()[currentEpicId];
    if(!epic) return;
    bar.innerHTML = `
      <div class="topbar-title-row">
        <div><h2><span class="sys-badge">${epic.system||''}</span> ${epic.name}</h2><div class="desc">${epic.status||''}</div></div>
        <div class="stats"><b>${epic.features.length}</b> Features · <b id="epicTotalTasks">–</b> tasks</div>
      </div>
      <div class="toolbar">
        <div class="search-wrap"><input id="searchBox" type="text" placeholder="ค้นหา task, source, dependency…"></div>
        <div class="chip active" data-c="all">ทั้งหมด <span class="mono" id="cnt-all"></span></div>
        <div class="chip active" data-c="green"><span class="dot"></span>พร้อม dev<span class="mono" id="cnt-green"></span></div>
        <div class="chip active" data-c="yellow"><span class="dot"></span>ต้องเช็คก่อน<span class="mono" id="cnt-yellow"></span></div>
        <div class="chip active" data-c="red"><span class="dot"></span>proposed<span class="mono" id="cnt-red"></span></div>
        <button class="btn ghost-dashed" id="toggleAll">ยุบ/ขยายทั้งหมด</button>
        <button class="btn primary" id="exportCsv">⇩ Export CSV</button>
      </div>`;
    wireEpicToolbar();
  }
}

// ============================================================================
// Epic detail view (feature chip nav + tables) — same content model as before
// ============================================================================
function stamp(c, note){
  return `<span class="stamp ${c}"><span class="badge"></span><span class="stamp-text">${clarityLabel[c]}${note ? " — " + note : ""}</span></span>`;
}
function taskRow(t, isSub){
  return `<tr class="${isSub?'sub':''}" data-c="${t.c}" data-text="${(t.task+' '+(t.desc||'')+' '+(t.dep||'')+' '+(t.src||'')+' '+(t.note||'')).toLowerCase()}">
    <td class="id">${t.id}</td><td class="task">${t.task}</td><td class="desc">${t.desc||''}</td>
    <td class="dep">${t.dep||''}</td><td class="src mono">${t.src||''}</td><td class="clarity">${stamp(t.c, t.note)}</td>
  </tr>`;
}

function renderEpicView(id){
  const epic = allEpics()[id];
  const root = document.getElementById('viewEpic');
  root.innerHTML = `
    <div class="feature-chip-nav" id="featureChipNav"></div>
    <details class="epic-deps card" open>
      <summary>Epic-level dependencies — Epic อื่นที่ต้องมาก่อน (ยังไม่ breakdown ในรอบนี้)</summary>
      <div class="dep-grid" id="epicDeps"></div>
    </details>
    <div id="featureContainer"></div>
    <div class="empty-state" id="emptyState">ไม่พบ task ที่ตรงกับตัวกรอง — ลองล้างคำค้นหรือเปิดสถานะเพิ่ม</div>
    <div class="card panel"><h3>ลำดับความสำคัญภายใน Epic</h3><div class="hint">เรียงตาม technical dependency ไม่ใช่ business value</div><ol class="priority" id="priorityList"></ol></div>
    <div class="card panel flags-panel"><h3>Flags — confirm ก่อนประเมิน manday จริง</h3><div class="hint">จุดที่ spec ยังขัดกันเอง เป็น blocker หรือยังไม่มีดีไซน์</div><ol class="flags" id="flagsList"></ol></div>
  `;

  const container = document.getElementById('featureContainer');
  const chipNav = document.getElementById('featureChipNav');
  const epicDepsEl = document.getElementById('epicDeps');
  let totalTasks = 0; const counts = { green:0, yellow:0, red:0 };

  epic.features.forEach(f=>{
    const tally = featureTally(f);
    totalTasks += tally.green+tally.yellow+tally.red;
    counts.green+=tally.green; counts.yellow+=tally.yellow; counts.red+=tally.red;

    let rows = '';
    f.tasks.forEach(t=>{ rows += taskRow(t,false); if(t.subs) t.subs.forEach(s=>rows+=taskRow(s,true)); });

    const section = document.createElement('section');
    section.className = 'feature card';
    section.id = f.id;
    section.innerHTML = `
      <div class="feature-head" data-target="${f.id}">
        <span class="fnum">${f.id}</span><h3>${f.name}</h3>
        <div class="feature-tally"><span class="tally-green">${tally.green}</span><span class="tally-yellow">${tally.yellow}</span><span class="tally-red">${tally.red}</span></div>
        <span class="caret">▾</span>
      </div>
      ${f.sources && f.sources.length ? `<div class="feature-source"><b>Source:</b> ${f.sources.join(' · ')}</div>` : ''}
      ${f.note ? `<div class="feature-note">${f.note}</div>` : ''}
      <div class="feature-body"><table><thead><tr><th>#</th><th>Task</th><th>คำอธิบาย</th><th>Dependency</th><th>Source</th><th>Clarity</th></tr></thead><tbody>${rows}</tbody></table></div>
    `;
    container.appendChild(section);

    const chip = document.createElement('div');
    chip.className = 'feature-chip';
    chip.dataset.target = f.id;
    chip.innerHTML = `<span class="fnum">${f.id}</span><span>${f.name.split('(')[0].trim()}</span>
      <span class="dots">${tally.green?'<i style="background:var(--green)"></i>':''}${tally.yellow?'<i style="background:var(--amber)"></i>':''}${tally.red?'<i style="background:var(--red)"></i>':''}</span>`;
    chip.addEventListener('click', ()=>{ section.scrollIntoView({behavior:'smooth', block:'start'}); });
    chipNav.appendChild(chip);
  });

  document.getElementById('epicTotalTasks') && (document.getElementById('epicTotalTasks').textContent = totalTasks);
  document.getElementById('cnt-all') && (document.getElementById('cnt-all').textContent = totalTasks);
  document.getElementById('cnt-green') && (document.getElementById('cnt-green').textContent = counts.green);
  document.getElementById('cnt-yellow') && (document.getElementById('cnt-yellow').textContent = counts.yellow);
  document.getElementById('cnt-red') && (document.getElementById('cnt-red').textContent = counts.red);

  (epic.epicDeps||[]).forEach(d=>{
    const row = document.createElement('div');
    row.className = 'dep-row'+(d.blocker?' blocker':'');
    row.innerHTML = `<div class="name">${d.name}</div><div>${d.why}</div>`;
    epicDepsEl.appendChild(row);
  });
  (epic.priority||[]).forEach(p=>{ const li=document.createElement('li'); li.innerHTML=p; document.getElementById('priorityList').appendChild(li); });
  (epic.flags||[]).forEach(fl=>{ const li=document.createElement('li'); li.innerHTML=fl; document.getElementById('flagsList').appendChild(li); });

  activeFilters = new Set(['green','yellow','red']);
  applyEpicFilters();

  container.addEventListener('click', (e)=>{
    const head = e.target.closest('.feature-head'); if(!head) return;
    const section = document.getElementById(head.dataset.target);
    const body = section.querySelector('.feature-body');
    const src = section.querySelector('.feature-source');
    const note = section.querySelector('.feature-note');
    const collapsed = head.classList.toggle('collapsed');
    body.style.display = collapsed ? 'none' : '';
    if(src) src.style.display = collapsed ? 'none' : '';
    if(note) note.style.display = collapsed ? 'none' : '';
  });
}

function wireEpicToolbar(){
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const c = chip.dataset.c;
      const allChip = document.querySelector('.chip[data-c="all"]');
      if(c==='all'){ activeFilters = new Set(['green','yellow','red']); document.querySelectorAll('.chip').forEach(ch=>ch.classList.add('active')); }
      else {
        if(activeFilters.has(c)){ activeFilters.delete(c); chip.classList.remove('active'); } else { activeFilters.add(c); chip.classList.add('active'); }
        if(activeFilters.size===3) allChip.classList.add('active'); else allChip.classList.remove('active');
      }
      applyEpicFilters();
    });
  });
  document.getElementById('searchBox').addEventListener('input', applyEpicFilters);
  document.getElementById('toggleAll').addEventListener('click', ()=>{
    const heads = document.querySelectorAll('.feature-head');
    const shouldCollapse = ![...heads].every(h=>h.classList.contains('collapsed'));
    heads.forEach(h=>{ if(h.classList.contains('collapsed') !== shouldCollapse) h.click(); });
  });
  document.getElementById('exportCsv').addEventListener('click', exportEpicCsv);
}

function applyEpicFilters(){
  const searchBox = document.getElementById('searchBox');
  if(!searchBox) return;
  const q = searchBox.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('#viewEpic table tbody tr').forEach(row=>{
    const show = activeFilters.has(row.dataset.c) && (!q || row.dataset.text.includes(q));
    row.classList.toggle('dim', !show);
    if(show) anyVisible = true;
  });
  document.querySelectorAll('#viewEpic section.feature').forEach(section=>{
    const visible = section.querySelectorAll('table tbody tr:not(.dim)').length;
    section.style.display = visible===0 ? 'none' : '';
  });
  const empty = document.getElementById('emptyState');
  if(empty) empty.style.display = anyVisible ? 'none' : 'block';
}

function csvEscape(v){ const s=(v===undefined||v===null)?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportEpicCsv(){
  const epic = allEpics()[currentEpicId];
  const visibleIds = new Set();
  document.querySelectorAll('#viewEpic table tbody tr:not(.dim)').forEach(row=> visibleIds.add(row.querySelector('.id').textContent.trim()));
  const header = ["Epic","Feature ID","Feature","Task ID","Task","Description","Dependency","Source","Clarity","Clarity Note"];
  const rows = [header];
  epic.features.forEach(f=>{
    const push = t=> rows.push([epic.name,f.id,f.name,t.id,t.task,t.desc||'',t.dep||'',t.src||'',clarityLabel[t.c]||t.c,t.note||'']);
    f.tasks.forEach(t=>{ push(t); if(t.subs) t.subs.forEach(s=>push(s)); });
  });
  const finalRows = [rows[0], ...rows.slice(1).filter(r=>visibleIds.has(r[3]))];
  downloadCsv(finalRows, `ncbs-${currentEpicId}-breakdown-${new Date().toISOString().slice(0,10)}.csv`);
}
function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ============================================================================
// Overview view
// ============================================================================
function renderOverview(){
  const root = document.getElementById('viewOverview');
  const ids = epicIds();
  let totalFeatures=0, totalTasks=0; const totals = { green:0, yellow:0, red:0 };
  const rows = ids.map(id=>{
    const e = allEpics()[id];
    const t = epicTally(e);
    const n = t.green+t.yellow+t.red;
    totalFeatures += e.features.length; totalTasks += n;
    totals.green+=t.green; totals.yellow+=t.yellow; totals.red+=t.red;
    return { id, e, t, n, riskPct: n? (t.yellow+t.red)/n : 0 };
  }).sort((a,b)=> b.riskPct - a.riskPct);

  const pct = (n,d)=> d? Math.round(n/d*100) : 0;

  root.innerHTML = `
    <div class="stat-grid">
      <div class="card stat-card"><div class="num">${ids.length}</div><div class="label">Epics</div></div>
      <div class="card stat-card"><div class="num">${totalFeatures}</div><div class="label">Features</div></div>
      <div class="card stat-card"><div class="num">${totalTasks}</div><div class="label">Tasks ทั้งหมด</div></div>
      <div class="card stat-card green"><div class="num">${pct(totals.green,totalTasks)}%</div><div class="label">พร้อม dev (${totals.green})</div></div>
      <div class="card stat-card red"><div class="num">${pct(totals.red,totalTasks)}%</div><div class="label">ยังเป็นแค่ proposed (${totals.red})</div></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="padding:16px 20px 0; margin:0; font-size:14px;">Epic Readiness — เรียงจาก "เสี่ยงสุด" (yellow+red มากสุด) ไปหา "พร้อมสุด"</h3>
      <div class="hint" style="padding:0 20px; margin:4px 0 10px; color:var(--ink-faint); font-size:11.8px;">คลิกแถวเพื่อเปิด epic นั้น — ใช้ดูว่า gap กระจุกอยู่ที่ไหนของโครงการ</div>
      <div id="heatmapRows"></div>
    </div>

    <div class="card flags-panel panel">
      <h3>Cross-epic Flags <span class="mono" style="font-size:10px; border:1px solid var(--border); padding:1px 6px; border-radius:4px; color:var(--ink-faint); font-weight:500;">กระทบมากกว่า 1 epic</span></h3>
      <div class="hint">ประเด็นเหล่านี้ควร escalate ระดับโครงการ ไม่ใช่แก้ทีละ epic — แก้ไขได้ที่ data/_cross-epic-flags.js</div>
      <ol class="flags" id="crossFlagsList"></ol>
    </div>
  `;

  const heatmapEl = document.getElementById('heatmapRows');
  rows.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'heatmap-row';
    const gp = pct(r.t.green, r.n), yp = pct(r.t.yellow, r.n), rp = 100-gp-yp;
    row.innerHTML = `
      <div class="ename"><span class="sys-tag">${r.e.system||''}</span><span>${r.e.name}</span></div>
      <div class="heatmap-bar"><div style="width:${gp}%; background:var(--green);"></div><div style="width:${yp}%; background:var(--amber);"></div><div style="width:${100-gp-yp}%; background:var(--red);"></div></div>
      <div class="counts">${r.t.green}/${r.t.yellow}/${r.t.red}</div>
    `;
    row.addEventListener('click', ()=> openEpic(r.id));
    heatmapEl.appendChild(row);
  });

  const crossList = document.getElementById('crossFlagsList');
  (window.NCBS_CROSS_EPIC_FLAGS||[]).forEach(flag=>{
    const li = document.createElement('li');
    li.innerHTML = `<b>${flag.title}</b> — ${flag.detail}` + (flag.epics && flag.epics.length ? `<div class="epic-tags">${flag.epics.map(e=>`<span>${e}</span>`).join('')}</div>` : '');
    crossList.appendChild(li);
  });
  if(!window.NCBS_CROSS_EPIC_FLAGS || window.NCBS_CROSS_EPIC_FLAGS.length===0){
    crossList.innerHTML = '<li>ยังไม่มีข้อมูล cross-epic flag — เพิ่มได้ที่ data/_cross-epic-flags.js</li>';
  }
}

// ============================================================================
// Timeline & Planning
// ============================================================================
// ============================================================================
// Mock manday estimator — เดา effort คร่าวๆ จาก keyword + clarity ของแต่ละ task
// ไม่ใช่ estimate จริงจากทีม — เป็นแค่ตัวเลขตั้งต้นให้เริ่มคุยกันง่ายขึ้น
// ============================================================================
const EFFORT_TIERS = [
  { tier:5, kws:['engine','algorithm','matching','state machine','multi-level','approval chain','blockchain','anchor','workflow','orchestrat','สถาปัตยกรรม','เอนจิน'] },
  { tier:4, kws:['integration','sync','dashboard','queue','notification','schedul','gateway','ingestion','pipeline','etl','เชื่อมต่อ'] },
  { tier:3, kws:['model','schema','validation','api','page','form','config','migration','erd','ตรวจสอบ','แบบฟอร์ม'] },
  { tier:2, kws:['toggle','flag','field','button','display','label','rule','ui:','เพิ่ม','ปรับปรุง','ปุ่ม'] },
];
const TIER_BASE_DEV = { 1:0.5, 2:1, 3:2, 4:3.5, 5:6 };
const CLARITY_DEV_MULT = { green:1, yellow:1.25, red:1.5 };
const CLARITY_POBA_BONUS = { green:0, yellow:0.25, red:0.75 };
const CLARITY_PM = { green:0.1, yellow:0.25, red:0.5 };

function detectEffortTier(text){
  for(const g of EFFORT_TIERS){ if(g.kws.some(k=>text.includes(k))) return g.tier; }
  return 1;
}
function roundQuarter(n){ return Math.round(n*4)/4; }

const CEREMONY_MANDAY_OVERRIDES = {
  // ระยะเวลาที่ PO ระบุตรงๆ (1 เดือน ≈ 20 วันทำการ) — ใช้แทน keyword-tier logic เพราะงานพวกนี้ไม่ใช่ dev task ทั่วไป
  'CER-1': { po_ba:5, tech_lead:0, dev:8,  qa_lead:8,  qa:20, pm:0,  dm:0 },  // SIT
  'CER-2': { po_ba:20,tech_lead:0, dev:0,  qa_lead:0,  qa:10, pm:5,  dm:0 },  // UAT
  'CER-3': { po_ba:0, tech_lead:5, dev:10, qa_lead:20, qa:0,  pm:0,  dm:0 },  // Pen Test & Performance
  'TRN-1': { po_ba:40,tech_lead:0, dev:0,  qa_lead:0,  qa:0,  pm:15, dm:0 },  // Training
};

function generateMockManday(task, isSub){
  if(CEREMONY_MANDAY_OVERRIDES[task.id]) return Object.assign({}, CEREMONY_MANDAY_OVERRIDES[task.id]);

  const text = (task.task+' '+(task.desc||'')).toLowerCase();
  const tier = detectEffortTier(text);
  let dev = TIER_BASE_DEV[tier];
  if(isSub) dev *= 0.7; // sub-task มักแคบกว่า parent เสมอแม้ keyword จะจับ tier เดียวกัน
  dev *= (CLARITY_DEV_MULT[task.c] || 1);

  const poba    = roundQuarter(dev*0.15 + (CLARITY_POBA_BONUS[task.c]||0));
  const techLead= roundQuarter(Math.max(0.25, dev*0.15));
  const qaLead  = roundQuarter(Math.max(0.25, dev*0.10));
  const qa      = roundQuarter(dev*0.35);
  const pm      = roundQuarter(CLARITY_PM[task.c] ?? 0.1);
  const dm      = /sync|migrat|etl|batch|anchor|ซิงค์|ย้ายข้อมูล/.test(text) ? roundQuarter(dev*0.3) : 0;

  return { po_ba:poba, tech_lead:techLead, dev:roundQuarter(dev), qa_lead:qaLead, qa, pm, dm };
}

function applyMockEstimates(overwrite){
  const flat = flattenAllTasks();
  flat.forEach(x=>{
    const p = getTaskPlan(x.key);
    const mock = generateMockManday(x.task, x.isSub);
    ROLES.forEach(r=>{
      const current = Number(p.manday[r.key]||0);
      if(overwrite || !current) p.manday[r.key] = mock[r.key];
    });
  });
  savePlanState();
  if(document.getElementById('ogContainer')) renderOutlineGantt();
}

function clearAllManday(){
  Object.values(planState.tasks).forEach(p=>{ ROLES.forEach(r=> p.manday[r.key]=0); });
  savePlanState();
  if(document.getElementById('ogContainer')) renderOutlineGantt();
}


const PLAN_STORAGE_KEY = 'ncbs-planning-v1';

// ============================================================================
// Recommended epic order — heuristic based on keyword matching against epic
// name/Thai name, reflecting typical NCBS dependency chain (foundation first,
// blocked/later-phase items last). Works off text, not hard-coded epic IDs,
// so it stays valid even as new epic files are added.
// ============================================================================
const EPIC_PRIORITY_TIERS = [
  { tier:1, kws:['foundation','identity','authentication',' auth','role & access','access management','institution structure','master data'] },
  { tier:2, kws:['user management','grade','credit management','credit transfer','data ingestion','learner identity','learner profile'] },
  { tier:3, kws:['notification','pdpa','compliance','api management','integration standards'] },
  { tier:4, kws:['dashboard','analytics','landing','cms','recommendation','result-upload','payment','white-label','whitelabel','skill matrix'] },
  { tier:5, kws:['blockchain','lms integration','blocked integrations','strategic gap'] },
  { tier:6, kws:['testing, training','go-live','ceremonies','readiness'] },  // SIT/UAT/Pen Test/Training — ต้องมาหลังสุดเสมอ
];
function epicPriorityTier(epic){
  const text = (epic.name+' '+(epic.thaiName||'')).toLowerCase();
  for(const g of EPIC_PRIORITY_TIERS){ if(g.kws.some(k=>text.includes(k))) return g.tier; }
  return 3;
}
function applyRecommendedEpicOrder(){
  const epics = allEpics();
  const scored = Object.keys(epics).map(id=>({ id, tier: epicPriorityTier(epics[id]) }));
  scored.sort((a,b)=> a.tier-b.tier); // stable sort — ties keep their relative order
  planState.epicOrder = scored.map(s=>s.id);
  savePlanState();
  if(document.getElementById('ogContainer')) renderOutlineGantt();
}

let planState = { projectStart:'', targetEnd:'', tasks:{} }; // tasks[key] = { seq, manday:{role:val}, }

function loadPlanState(){
  return fetch('data/planning-state.json').then(r=>{
    if(!r.ok) throw new Error('no file');
    return r.json();
  }).catch(()=>{
    try{ const raw = localStorage.getItem(PLAN_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }).then(data=>{
    if(data) planState = Object.assign({projectStart:'',targetEnd:'',tasks:{}}, data);
  });
}
function savePlanState(){
  try{ localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(planState)); }catch(e){}
}
function getTaskPlan(key){
  if(!planState.tasks[key]) planState.tasks[key] = { seq:0, manday:Object.fromEntries(ROLES.map(r=>[r.key,0])) };
  return planState.tasks[key];
}

function isWeekend(d){ const day=d.getDay(); return day===0||day===6; }
function nextBusinessDay(d){ const r=new Date(d); while(isWeekend(r)) r.setDate(r.getDate()+1); return r; }
function addBusinessDays(start, days){
  let d = new Date(start); let added=0;
  while(added<days){ d.setDate(d.getDate()+1); if(!isWeekend(d)) added++; }
  return d;
}
function fmtDate(d){ if(!d) return '–'; return d.toLocaleDateString('th-TH',{ year:'numeric', month:'short', day:'numeric' }); }

function keyEpic(epicId){ return `E::${epicId}`; }
function keyFeature(epicId, featureId){ return `F::${epicId}::${featureId}`; }
function keyTask(epicId, taskId){ return `T::${epicId}::${taskId}`; }
function keySub(epicId, subId){ return `S::${epicId}::${subId}`; }
function isHiddenKey(k){ return !!(planState.hidden||{})[k]; }
function toggleHiddenKey(k){ planState.hidden = planState.hidden||{}; planState.hidden[k] = !planState.hidden[k]; savePlanState(); }

function syncOrder(existing, actualIds){
  const arr = (existing||[]).filter(id=>actualIds.includes(id));
  actualIds.forEach(id=>{ if(!arr.includes(id)) arr.push(id); });
  return arr;
}

// ============================================================================
// Build the ordered Epic > Feature > Task(+Sub) tree, respecting custom order
// (drag-and-drop) and hidden flags. This is the single source of truth for
// both the schedule computation and the outline+Gantt render.
// ============================================================================
function buildOrderedTree(){
  const epics = allEpics();
  planState.epicOrder = syncOrder(planState.epicOrder, Object.keys(epics));
  planState.featureOrder = planState.featureOrder || {};
  planState.taskOrder = planState.taskOrder || {};

  const tree = [];
  planState.epicOrder.forEach(epicId=>{
    const epic = epics[epicId]; if(!epic) return;
    const eKey = keyEpic(epicId);
    const featureIds = epic.features.map(f=>f.id);
    planState.featureOrder[epicId] = syncOrder(planState.featureOrder[epicId], featureIds);

    const featureNodes = [];
    planState.featureOrder[epicId].forEach(featureId=>{
      const f = epic.features.find(x=>x.id===featureId); if(!f) return;
      const fKey = keyFeature(epicId, featureId);
      const taskIds = f.tasks.map(t=>t.id);
      const tOrderKey = `${epicId}::${featureId}`;
      planState.taskOrder[tOrderKey] = syncOrder(planState.taskOrder[tOrderKey], taskIds);

      const taskNodes = [];
      planState.taskOrder[tOrderKey].forEach(taskId=>{
        const t = f.tasks.find(x=>x.id===taskId); if(!t) return;
        const tKey = keyTask(epicId, taskId);
        const planKey = `${epicId}::${taskId}`;
        const subs = (t.subs||[]).map(s=>({
          type:'sub', key:keySub(epicId, s.id), planKey:`${epicId}::${s.id}`,
          data:s, hidden:isHiddenKey(keySub(epicId, s.id)),
        }));
        taskNodes.push({ type:'task', key:tKey, planKey, data:t, hidden:isHiddenKey(tKey), epicId, epicName:epic.name, featureId, featureName:f.name, subs });
      });
      featureNodes.push({ type:'feature', key:fKey, epicId, epicName:epic.name, featureId, data:f, hidden:isHiddenKey(fKey), tasks:taskNodes });
    });
    tree.push({ type:'epic', key:eKey, epicId, data:epic, hidden:isHiddenKey(eKey), features:featureNodes });
  });
  return tree;
}

function flattenScheduleOrder(tree){
  const seq = [];
  tree.forEach(epicNode=>{
    if(epicNode.hidden) return;
    epicNode.features.forEach(featNode=>{
      if(featNode.hidden) return;
      featNode.tasks.forEach(taskNode=>{
        if(taskNode.hidden) return;
        seq.push({ key:taskNode.planKey, task:taskNode.data, isSub:false });
        taskNode.subs.forEach(subNode=>{
          if(subNode.hidden) return;
          seq.push({ key:subNode.planKey, task:subNode.data, isSub:true });
        });
      });
    });
  });
  return seq;
}

function computeSchedule(){
  const tree = buildOrderedTree();
  const order = flattenScheduleOrder(tree);
  const start = planState.projectStart ? nextBusinessDay(new Date(planState.projectStart)) : null;
  let cursor = start;
  const scheduleMap = {};
  order.forEach(item=>{
    const p = getTaskPlan(item.key);
    const duration = Math.ceil(Math.max(0, ...Object.values(p.manday||{}), 0));
    let s=null, e=null;
    if(cursor){ s = new Date(cursor); e = duration>0 ? addBusinessDays(cursor, duration) : new Date(cursor); if(duration>0) cursor = e; }
    scheduleMap[item.key] = { start:s, end:e, duration, plan:p };
  });
  return { tree, order, scheduleMap, projectEnd: cursor };
}

function computeRollups(tree, scheduleMap){
  const taskRange = {}, featureRange = {}, epicRange = {};
  tree.forEach(epicNode=>{
    if(epicNode.hidden) return;
    let eStart=null, eEnd=null;
    epicNode.features.forEach(featNode=>{
      if(featNode.hidden) return;
      let fStart=null, fEnd=null;
      featNode.tasks.forEach(taskNode=>{
        if(taskNode.hidden) return;
        const keys = [taskNode.planKey, ...taskNode.subs.filter(s=>!s.hidden).map(s=>s.planKey)];
        let tStart=null, tEnd=null;
        keys.forEach(k=>{ const s=scheduleMap[k]; if(s && s.start){ if(!tStart||s.start<tStart) tStart=s.start; if(!tEnd||s.end>tEnd) tEnd=s.end; } });
        taskRange[taskNode.planKey] = { start:tStart, end:tEnd };
        if(tStart){ if(!fStart||tStart<fStart) fStart=tStart; if(!fEnd||tEnd>fEnd) fEnd=tEnd; }
      });
      featureRange[featNode.key] = { start:fStart, end:fEnd };
      if(fStart){ if(!eStart||fStart<eStart) eStart=fStart; if(!eEnd||fEnd>eEnd) eEnd=fEnd; }
    });
    epicRange[epicNode.key] = { start:eStart, end:eEnd };
  });
  return { taskRange, featureRange, epicRange };
}

let expandedTasks = new Set();    // session-only: which task keys have detail panel open

const PX_PER_DAY = 26;

function fmtDateShort(d){ if(!d) return ''; return d.toLocaleDateString('th-TH',{ month:'short', day:'numeric' }); }

function matchesSearch(node){
  if(!planSearchQuery) return true;
  const text = (node.data.task+' '+(node.data.desc||'')).toLowerCase();
  return text.includes(planSearchQuery);
}

function renderOutlineGantt(){
  const { tree, scheduleMap, projectEnd } = computeSchedule();
  const { taskRange, featureRange, epicRange } = computeRollups(tree, scheduleMap);

  document.getElementById('computedEnd').innerHTML = projectEnd ? `<b>${fmtDate(projectEnd)}</b>` : 'กำหนด Start Date ก่อน';
  const varEl = document.getElementById('varianceReadout');
  if(planState.targetEnd && projectEnd){
    const target = new Date(planState.targetEnd);
    const diffDays = Math.round((target-projectEnd)/86400000);
    varEl.innerHTML = diffDays>=0 ? `<span class="variance-ok">เหลือ buffer ~${diffDays} วัน</span>` : `<span class="variance-bad">เกินเป้า ~${Math.abs(diffDays)} วัน</span>`;
  } else varEl.textContent = '';

  const totals = Object.fromEntries(ROLES.map(r=>[r.key,0]));
  Object.values(scheduleMap).forEach(s=> ROLES.forEach(r=> totals[r.key] += Number(s.plan.manday[r.key]||0)));
  document.getElementById('workloadStrip').innerHTML = ROLES.map((r,i)=>`
    <div class="workload-seg"><div class="role">${r.label}</div><div class="val" style="color:${ROLE_COLORS[i]}">${totals[r.key]||0}</div></div>
  `).join('');

  const projStart = planState.projectStart ? nextBusinessDay(new Date(planState.projectStart)) : null;
  const overallEnd = projectEnd;
  const totalDays = (projStart && overallEnd) ? Math.max(14, Math.ceil((overallEnd-projStart)/86400000)+5) : 21;
  const timelineWidth = totalDays*PX_PER_DAY;
  const dateToX = d => (!projStart||!d) ? 0 : Math.max(0,(d-projStart)/86400000)*PX_PER_DAY;

  let headerTicks = '';
  if(projStart){
    for(let i=0; i<=totalDays; i+=7){
      const d = new Date(projStart); d.setDate(d.getDate()+i);
      headerTicks += `<div class="og-date-tick" style="left:${i*PX_PER_DAY}px;">${fmtDateShort(d)}</div>`;
    }
  } else {
    headerTicks = `<div class="og-date-tick" style="left:8px; border-left:none;">กำหนด Project Start Date เพื่อดู timeline</div>`;
  }

  function barHtml(range, colorVar){
    if(!range || !range.start || !projStart) return '';
    const left = dateToX(range.start);
    const width = Math.max(4, dateToX(range.end) - left);
    return `<div class="og-bar" style="left:${left}px; width:${width}px; background:${colorVar};" title="${fmtDate(range.start)} → ${fmtDate(range.end)}"></div>`;
  }
  function clarityColor(c){ return c==='green' ? 'var(--green)' : (c==='yellow' ? 'var(--amber)' : 'var(--red)'); }
  function mandayTotal(planKey){ return Object.values(getTaskPlan(planKey).manday).reduce((a,b)=>a+Number(b||0),0); }

  let rowsHtml = '';
  tree.forEach(epicNode=>{
    const epic = epicNode.data;
    const visibleFeatures = epicNode.features.filter(f=> f.tasks.some(t=>matchesSearch(t) || t.subs.some(s=>matchesSearch(s))));
    if(planSearchQuery && visibleFeatures.length===0) return;

    const eCollapsed = collapsedNodes.has(epicNode.key);
    rowsHtml += `
      <div class="og-row level-epic ${epicNode.hidden?'hidden-item':''}" draggable="true" data-order-scope="epic" data-order-id="${epicNode.epicId}">
        <div class="og-label-cell">
          <span class="og-drag-handle">☰</span>
          <span class="og-caret ${eCollapsed?'collapsed':''}" data-caret-key="${epicNode.key}">▾</span>
          <span class="og-eye" data-hide-key="${epicNode.key}">${epicNode.hidden?'🚫':'👁'}</span>
          <span class="og-sys">${epic.system||''}</span>
          <span class="og-name">${epic.name}</span>
        </div>
        <div class="og-timeline-cell" style="width:${timelineWidth}px;">${barHtml(epicRange[epicNode.key], 'var(--primary)')}</div>
      </div>`;

    if(eCollapsed) return;
    epicNode.features.forEach(featNode=>{
      const f = featNode.data;
      if(planSearchQuery && !featNode.tasks.some(t=>matchesSearch(t) || t.subs.some(s=>matchesSearch(s)))) return;
      const fCollapsed = collapsedNodes.has(featNode.key);
      rowsHtml += `
        <div class="og-row level-feature ${featNode.hidden?'hidden-item':''}" draggable="true" data-order-scope="feat:${featNode.epicId}" data-order-id="${featNode.featureId}">
          <div class="og-label-cell">
            <span class="og-drag-handle">☰</span>
            <span class="og-caret ${fCollapsed?'collapsed':''}" data-caret-key="${featNode.key}">▾</span>
            <span class="og-eye" data-hide-key="${featNode.key}">${featNode.hidden?'🚫':'👁'}</span>
            <span class="og-name">${f.name}</span>
          </div>
          <div class="og-timeline-cell" style="width:${timelineWidth}px;">${barHtml(featureRange[featNode.key], 'var(--purple)')}</div>
        </div>`;

      if(fCollapsed) return;
      featNode.tasks.forEach(taskNode=>{
        if(planSearchQuery && !matchesSearch(taskNode) && !taskNode.subs.some(s=>matchesSearch(s))) return;
        const t = taskNode.data;
        const isOpen = expandedTasks.has(taskNode.key);
        const total = mandayTotal(taskNode.planKey);
        rowsHtml += `
          <div class="og-row level-task ${taskNode.hidden?'hidden-item':''}" draggable="true" data-order-scope="task:${taskNode.epicId}::${taskNode.featureId}" data-order-id="${t.id}">
            <div class="og-label-cell" data-task-toggle="${taskNode.key}">
              <span class="og-drag-handle">☰</span>
              <span class="og-eye" data-hide-key="${taskNode.key}">${taskNode.hidden?'🚫':'👁'}</span>
              <span class="og-dot" style="background:${clarityColor(t.c)}"></span>
              <span class="og-name mono">${t.id}</span>
              <span class="og-name">${t.task}</span>
              <span class="og-badge">${total>0?total+'d':''}</span>
            </div>
            <div class="og-timeline-cell" style="width:${timelineWidth}px;">${barHtml(taskRange[taskNode.planKey], clarityColor(t.c))}</div>
          </div>`;

        if(isOpen){
          const p = getTaskPlan(taskNode.planKey);
          rowsHtml += `
            <div class="og-detail">
              <div class="og-detail-grid">
                <div><b>คำอธิบาย</b>${t.desc||'–'}</div>
                <div><b>Dependency</b>${t.dep||'–'}</div>
                <div><b>Source</b>${t.src||'–'}</div>
                <div><b>Clarity</b>${stamp(t.c, t.note)}</div>
              </div>
              <div class="og-manday-inputs">
                ${ROLES.map(r=>`<div class="mini-field"><label>${r.label}</label><input type="number" min="0" step="0.5" value="${p.manday[r.key]||0}" data-manday-key="${taskNode.planKey}" data-role="${r.key}"></div>`).join('')}
              </div>
              ${taskNode.subs.length ? `<div class="og-sub-list">
                <div class="og-sub-list-label">Sub-tasks</div>
                ${taskNode.subs.map(s=>{
                  const sp = getTaskPlan(s.planKey);
                  return `<div class="og-sub-row ${s.hidden?'hidden-item':''}">
                    <span class="og-eye" data-hide-key="${s.key}">${s.hidden?'🚫':'👁'}</span>
                    <span class="og-dot" style="background:${clarityColor(s.data.c)}"></span>
                    <span class="og-name">${s.data.id} ${s.data.task}</span>
                    ${ROLES.map(r=>`<input type="number" min="0" step="0.5" title="${r.label}" value="${sp.manday[r.key]||0}" data-manday-key="${s.planKey}" data-role="${r.key}">`).join('')}
                  </div>`;
                }).join('')}
              </div>` : ''}
            </div>`;
        }
      });
    });
  });

  const container = document.getElementById('ogContainer');
  container.innerHTML = `
    <div class="og-header-row">
      <div class="og-label-col-head">Epic / Feature / Task</div>
      <div class="og-timeline-head" style="width:${timelineWidth}px;">${headerTicks}</div>
    </div>
    ${rowsHtml || '<div class="timeline-hint" style="padding:16px 20px;">ไม่พบ task ที่ตรงกับคำค้นหา</div>'}
  `;
}

// ============================================================================
// Delegated events for the outline+Gantt tree — attached once, works across re-renders
// ============================================================================
let dragCtx = null;

function wireOutlineGanttEvents(){
  const container = document.getElementById('ogContainer');

  container.addEventListener('click', e=>{
    const eye = e.target.closest('.og-eye');
    if(eye){ toggleHiddenKey(eye.dataset.hideKey); renderOutlineGantt(); return; }

    const caret = e.target.closest('.og-caret');
    if(caret){ const k=caret.dataset.caretKey; collapsedNodes.has(k)?collapsedNodes.delete(k):collapsedNodes.add(k); renderOutlineGantt(); return; }

    const bar = e.target.closest('.og-bar');
    if(bar){
      const row = bar.closest('.og-row');
      if(row.classList.contains('level-epic')){ const c=row.querySelector('.og-caret'); if(c) c.click(); return; }
      if(row.classList.contains('level-feature')){ const c=row.querySelector('.og-caret'); if(c) c.click(); return; }
    }

    const toggle = e.target.closest('[data-task-toggle]');
    if(toggle){
      const k = toggle.dataset.taskToggle;
      expandedTasks.has(k) ? expandedTasks.delete(k) : expandedTasks.add(k);
      renderOutlineGantt();
      return;
    }
  });

  container.addEventListener('change', e=>{
    const inp = e.target.closest('input[data-manday-key]');
    if(!inp) return;
    const p = getTaskPlan(inp.dataset.mandayKey);
    p.manday[inp.dataset.role] = Number(inp.value)||0;
    savePlanState();
    renderOutlineGantt();
  });

  container.addEventListener('dragstart', e=>{
    const row = e.target.closest('.og-row[draggable="true"]');
    if(!row) return;
    dragCtx = { scope: row.dataset.orderScope, fromId: row.dataset.orderId };
    row.classList.add('dragging');
  });
  container.addEventListener('dragover', e=>{
    const row = e.target.closest('.og-row[draggable="true"]');
    if(!row || !dragCtx || row.dataset.orderScope!==dragCtx.scope) return;
    e.preventDefault();
    const rect = row.getBoundingClientRect();
    const topHalf = (e.clientY-rect.top) < rect.height/2;
    document.querySelectorAll('.og-row').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
    row.classList.add(topHalf?'drag-over-top':'drag-over-bottom');
  });
  container.addEventListener('drop', e=>{
    const row = e.target.closest('.og-row[draggable="true"]');
    if(!row || !dragCtx || row.dataset.orderScope!==dragCtx.scope){ dragCtx=null; return; }
    e.preventDefault();
    const rect = row.getBoundingClientRect();
    const topHalf = (e.clientY-rect.top) < rect.height/2;
    performReorder(dragCtx.scope, dragCtx.fromId, row.dataset.orderId, topHalf);
    dragCtx = null;
  });
  container.addEventListener('dragend', ()=>{
    document.querySelectorAll('.og-row').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom','dragging'));
    dragCtx = null;
  });
}

function performReorder(scope, fromId, toId, insertBefore){
  if(fromId===toId) return;
  let arrRef;
  if(scope==='epic') arrRef = planState.epicOrder;
  else if(scope.startsWith('feat:')) arrRef = planState.featureOrder[scope.slice(5)];
  else if(scope.startsWith('task:')) arrRef = planState.taskOrder[scope.slice(5)];
  if(!arrRef) return;
  const fromIdx = arrRef.indexOf(fromId);
  if(fromIdx===-1) return;
  arrRef.splice(fromIdx,1);
  let toIdx = arrRef.indexOf(toId);
  if(toIdx===-1) toIdx = arrRef.length;
  else if(!insertBefore) toIdx += 1;
  arrRef.splice(toIdx,0,fromId);
  savePlanState();
  renderOutlineGantt();
}

function exportTimelineCsv(){
  const { order, scheduleMap } = computeSchedule();
  const header = ["Epic","Feature","Task ID","Task", ...ROLES.map(r=>r.label), "Total Manday","Start","End"];
  // rebuild epic/feature name lookup since `order` only carries key+task+isSub
  const tree = buildOrderedTree();
  const nameByKey = {};
  tree.forEach(en=> en.features.forEach(fn=> fn.tasks.forEach(tn=>{
    nameByKey[tn.planKey] = { epicName: en.data.name, featureName: fn.data.name };
    tn.subs.forEach(s=> nameByKey[s.planKey] = { epicName: en.data.name, featureName: fn.data.name });
  })));
  const rows = [header, ...order.map(x=>{
    const names = nameByKey[x.key] || { epicName:'', featureName:'' };
    const sched = scheduleMap[x.key];
    const manday = sched.plan.manday;
    return [
      names.epicName, names.featureName, x.task.id, x.task.task,
      ...ROLES.map(r=>manday[r.key]||0),
      Object.values(manday).reduce((a,b)=>a+Number(b||0),0),
      sched.start?fmtDate(sched.start):'', sched.end?fmtDate(sched.end):''
    ];
  })];
  downloadCsv(rows, `ncbs-timeline-${new Date().toISOString().slice(0,10)}.csv`);
}

// ============================================================================
// Boot — โหลด data file ทั้งหมดตาม data/manifest.json ก่อน แล้วค่อย build UI
// ============================================================================
function loadEpicScripts(){
  return fetch('data/manifest.json')
    .then(r=>{ if(!r.ok) throw new Error('manifest.json not found'); return r.json(); })
    .then(files=> Promise.all(files.map(f=> new Promise(resolve=>{
      const s = document.createElement('script');
      s.src = 'data/' + f;
      s.onload = resolve;
      s.onerror = ()=>{ console.warn('โหลดไม่สำเร็จ:', f); resolve(); };
      document.body.appendChild(s);
    }))))
    .catch(err=>{ console.warn('อ่าน data/manifest.json ไม่สำเร็จ — ตรวจว่ามีไฟล์นี้อยู่ใน data/ และรัน update-manifest.sh แล้วหรือยัง', err); });
}

loadEpicScripts().then(loadPlanState).then(()=>{
  buildSidebar();
  switchView('overview');
});
